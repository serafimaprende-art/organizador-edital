<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Organizador de Edital</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#EEF0EA;
  --paper-2:#E4E7DE;
  --card:#FCFCFA;
  --line:#D6D9CC;
  --ink:#1C2B45;
  --ink-2:#4C5A70;
  --ink-3:#8590A0;
  --stamp:#A6342A;
  --stamp-dark:#7E271F;
  --gold:#AD8A2C;
  --approved:#2E6B52;
  --approved-bg:#E4EFE9;
  --overdue-bg:#F5E6E3;
  --radius:10px;
  --font-display:'Source Serif 4', Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', 'Courier New', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    linear-gradient(var(--paper-2) 1px, transparent 1px);
  background-size: 100% 32px;
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}

.wrap{max-width:920px;margin:0 auto;padding:20px 20px 80px;}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; gap:14px;
  padding:18px 4px 14px;
  border-bottom:2px solid var(--ink);
  margin-bottom:4px;
}
.logo-stamp{
  width:46px;height:46px;border-radius:50%;
  border:2px solid var(--stamp);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:15px;
  color:var(--stamp); transform:rotate(-8deg); flex:0 0 auto;
}
.title-block h1{
  font-family:var(--font-display); font-weight:700; font-size:22px; margin:0;
  letter-spacing:.2px;
}
.title-block p{
  margin:2px 0 0; font-size:12.5px; color:var(--ink-2);
  font-family:var(--font-mono); letter-spacing:.4px; text-transform:uppercase;
}
.topbar-actions{margin-left:auto;}
.btn-ghost-small{
  background:transparent;border:1px solid var(--line); color:var(--ink-2);
  font-size:12px; padding:7px 12px; border-radius:999px; cursor:pointer;
  font-family:var(--font-mono);
}
.btn-ghost-small:hover{border-color:var(--stamp); color:var(--stamp);}

/* ---------- Tabs ---------- */
.tabs{
  display:flex; gap:2px; margin:18px 0 22px; overflow-x:auto;
  border-bottom:1px solid var(--line);
}
.tab{
  padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--ink-2);
  background:none;border:none;cursor:pointer; white-space:nowrap;
  border-bottom:3px solid transparent; margin-bottom:-1px;
  font-family:var(--font-body);
}
.tab.active{color:var(--stamp); border-bottom-color:var(--stamp);}
.tab:hover:not(.active){color:var(--ink);}

/* ---------- Cards / generic ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; margin-bottom:16px;
}
.card h2{font-family:var(--font-display); font-size:18px; margin:0 0 4px;}
.card .sub{color:var(--ink-2); font-size:13px; margin:0 0 14px;}
.grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px;}
.stat{
  border:1px dashed var(--line); border-radius:var(--radius); padding:14px;
  background:var(--card);
}
.stat .num{font-family:var(--font-mono); font-size:26px; font-weight:600; color:var(--ink);}
.stat .lbl{font-size:11.5px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}

.btn{
  background:var(--stamp); color:#fff; border:none; border-radius:8px;
  padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer;
  font-family:var(--font-body);
}
.btn:hover{background:var(--stamp-dark);}
.btn.secondary{background:var(--ink); }
.btn.secondary:hover{background:#0f1a2c;}
.btn.outline{background:transparent; color:var(--stamp); border:1.5px solid var(--stamp);}
.btn.outline:hover{background:var(--stamp); color:#fff;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

input[type=text], textarea, select{
  font-family:var(--font-body); font-size:14px; color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  background:#fff; width:100%;
}
textarea{resize:vertical; font-family:var(--font-mono); font-size:13px; line-height:1.5;}

/* ---------- Onboarding ---------- */
.onboarding{padding-top:10px;}
.onboarding h2{font-family:var(--font-display); font-size:26px; margin:0 0 8px;}
.onboarding .lede{color:var(--ink-2); font-size:14.5px; max-width:520px; margin-bottom:20px;}
.hint{font-size:12px; color:var(--ink-3); margin-top:8px;}

/* Stamp overlay (signature moment) */
.stamp-overlay{
  position:fixed; inset:0; background:rgba(28,43,69,.55); z-index:50;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.stamp-visual{
  width:230px; height:230px; border-radius:50%; border:6px solid var(--stamp);
  background:rgba(255,255,255,.04); display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  transform:rotate(-9deg) scale(.7); opacity:0;
  animation: stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards;
  box-shadow:0 0 0 3px rgba(166,52,42,.25) inset;
}
.stamp-visual .l1{font-family:var(--font-display); font-weight:700; color:var(--stamp); font-size:20px; letter-spacing:1px;}
.stamp-visual .l2{font-family:var(--font-mono); color:var(--stamp); font-size:11px; margin-top:8px; letter-spacing:1px;}
.stamp-visual .l3{font-family:var(--font-mono); color:var(--stamp); font-size:10px; margin-top:14px; opacity:.75;}
@keyframes stampIn{ to{ transform:rotate(-9deg) scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce){
  .stamp-visual{ animation:none; transform:rotate(-9deg) scale(1); opacity:1; }
}

/* ---------- Plano (checklist) ---------- */
.discipline{
  border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; background:var(--card);
}
.discipline-head{
  display:flex; align-items:center; gap:10px; padding:13px 16px;
  border-bottom:1px solid var(--line); cursor:pointer; background:#F7F7F3;
}
.discipline-head h3{font-family:var(--font-display); font-size:15.5px; margin:0; flex:1;}
.progress-pill{
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-2);
  border:1px solid var(--line); padding:3px 9px; border-radius:999px; background:#fff;
}
.chevron{transition:transform .15s ease; color:var(--ink-3); font-size:12px;}
.discipline.collapsed .chevron{transform:rotate(-90deg);}
.discipline.collapsed .discipline-body{display:none;}
.discipline-body{padding:6px 16px 14px;}
.topic-row{
  display:flex; align-items:flex-start; gap:10px; padding:8px 0;
  border-bottom:1px dashed var(--line);
}
.topic-row:last-of-type{border-bottom:none;}
.topic-row input[type=checkbox]{margin-top:3px; width:16px; height:16px; accent-color:var(--approved); flex:0 0 auto;}
.topic-row .tname{flex:1; font-size:13.5px; line-height:1.4;}
.topic-row.studied .tname{color:var(--ink-3); text-decoration:line-through;}
.topic-del{background:none; border:none; color:var(--ink-3); cursor:pointer; font-size:15px; line-height:1; padding:2px 4px;}
.topic-del:hover{color:var(--stamp);}
.add-row{display:flex; gap:8px; margin-top:10px;}
.disc-del{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:13px;}
.disc-del:hover{color:var(--stamp);}
.new-disc-row{display:flex; gap:8px; margin-top:6px;}

/* ---------- Cronômetro ---------- */
.timer-display{
  font-family:var(--font-mono); font-size:56px; font-weight:600; text-align:center;
  letter-spacing:2px; margin:10px 0 18px; color:var(--ink);
}
.timer-controls{display:flex; gap:10px; justify-content:center; margin-bottom:6px;}
.session-log{font-size:13px;}
.session-log .row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line);}
.session-log .row span:last-child{font-family:var(--font-mono); color:var(--ink-2);}

/* ---------- Revisões ---------- */
.review-group h3{
  font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--ink-2); margin:18px 0 8px;
}
.review-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:8px;
  border:1px solid var(--line); margin-bottom:8px; background:var(--card);
}
.review-row.late{background:var(--overdue-bg); border-color:#E3C4BE;}
.review-row .rinfo{flex:1;}
.review-row .rdisc{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-3); font-family:var(--font-mono);}
.review-row .rtopic{font-size:13.5px; margin-top:2px;}
.review-row .rdate{font-family:var(--font-mono); font-size:11.5px; color:var(--stamp);}
.empty-note{color:var(--ink-3); font-size:13.5px; padding:14px 0;}

/* ---------- Relatórios ---------- */
.bar-row{margin-bottom:14px;}
.bar-row .blabel{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
.bar-row .blabel b{font-weight:600;}
.bar-row .btrack{height:9px; background:var(--paper-2); border-radius:999px; overflow:hidden;}
.bar-row .bfill{height:100%; background:var(--approved); border-radius:999px;}
.weak-item{
  display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.5px;
}
.weak-flag{color:var(--stamp); font-family:var(--font-mono); font-size:11px; border:1px solid var(--stamp); border-radius:5px; padding:2px 6px; flex:0 0 auto;}

/* ---------- Confirm inline ---------- */
.confirm-box{
  border:1px solid var(--stamp); background:var(--overdue-bg); border-radius:8px;
  padding:12px 14px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}

footer.credit{text-align:center; color:var(--ink-3); font-size:11.5px; margin-top:30px; font-family:var(--font-mono);}

@media (max-width:560px){
  .timer-display{font-size:40px;}
  .wrap{padding:14px 12px 60px;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ Runtime state ============ */
let state = { plan: null, sessions: [] };
let activeTab = 'painel';
let confirmingReset = false;
let collapsedDisciplines = {};

const timer = { running:false, seconds:0, disciplineId:null, intervalId:null };

const STORAGE_KEY = 'organizador-edital-v1';

/* ============ Utils ============ */
function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function cap(s){ s = s.trim(); if(!s) return s; return s.charAt(0).toUpperCase() + s.slice(1); }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============ Persistence ============ */
async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY);
    if(r && r.value){ state = JSON.parse(r.value); }
  }catch(e){ /* no saved data yet */ }
  render();
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error('Falha ao salvar', e); }
}

/* ============ Edital parser ============ */
function isDisciplineHeader(line){
  if(line.length < 3 || line.length > 100) return false;
  const letters = line.replace(/[^A-Za-zÀ-ÿ]/g,'');
  if(letters.length < 4) return false;
  const upperLetters = letters.replace(/[^A-ZÀ-Ý]/g,'');
  const upperRatio = upperLetters.length / letters.length;
  const numberedCaps = /^\d+([.\-)]|\s)+[A-ZÀ-Ý]/.test(line) && upperRatio > 0.6;
  const allCapsLine = upperRatio > 0.85;
  return numberedCaps || allCapsLine;
}
function cleanHeader(line){
  return cap(line.replace(/^\d+([.\-)]\s*)+/, '').replace(/[:\-–]+$/, '').trim().toLowerCase());
}
function splitTopics(text){
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const topics = [];
  lines.forEach(line=>{
    let cleaned = line
      .replace(/^[\-•*]\s*/,'')
      .replace(/^\d+(\.\d+)*[.)]?\s*/,'')
      .replace(/^[a-zA-Z][.)]\s*/,'')
      .trim();
    if(!cleaned) return;
    if(cleaned.includes(';')){
      cleaned.split(';').forEach(t=>{ t=t.trim().replace(/^[\-•]\s*/,''); if(t) topics.push(cap(t)); });
    } else if(cleaned.length > 220 && /\d+\s+[A-ZÀ-Ý]/.test(cleaned)){
      cleaned.split(/\d+\s+(?=[A-ZÀ-Ý])/).map(s=>s.trim()).filter(Boolean).forEach(p=>topics.push(cap(p)));
    } else {
      topics.push(cap(cleaned));
    }
  });
  return topics.filter(t => t.length > 1);
}
function parseEdital(raw){
  const lines = raw.split('\n').map(l=>l.trim());
  const disciplines = [];
  let current = null;
  let buffer = [];
  function flush(){
    if(current){
      const topics = splitTopics(buffer.join('\n'));
      current.topics = topics.map(t => ({ id: uid(), name: t, studied:false, studiedDate:null, reviews:[] }));
      if(current.topics.length) disciplines.push(current);
    }
    buffer = [];
  }
  lines.forEach(line=>{
    if(!line) return;
    if(isDisciplineHeader(line)){
      flush();
      current = { id: uid(), name: cleanHeader(line), topics: [] };
    } else {
      if(!current) current = { id: uid(), name: 'Conteúdo geral', topics: [] };
      buffer.push(line);
    }
  });
  flush();
  return disciplines;
}

/* ============ Actions ============ */
function generatePlan(){
  const raw = document.getElementById('edital-input').value;
  const titleInput = document.getElementById('edital-title');
  const title = titleInput ? titleInput.value.trim() : '';
  if(!raw || raw.trim().length < 10){
    alertInline('Cole o texto do edital (disciplinas e conteúdo programático) antes de gerar o plano.');
    return;
  }
  const disciplines = parseEdital(raw);
  if(!disciplines.length){
    alertInline('Não consegui identificar disciplinas no texto colado. Tente colar o conteúdo programático completo (com nomes de disciplinas em destaque ou maiúsculas).');
    return;
  }
  const protocol = 'ED-' + Date.now().toString().slice(-8);
  state.plan = {
    protocol,
    editalTitle: title || 'Edital sem título',
    generatedAt: todayISO(),
    disciplines
  };
  state.sessions = state.sessions || [];
  saveState();
  activeTab = 'painel';
  render();
  showStampOverlay(protocol);
}

function alertInline(msg){
  const box = document.getElementById('onboarding-error');
  if(box){ box.textContent = msg; box.style.display = 'block'; }
}

function showStampOverlay(protocol){
  const overlay = document.createElement('div');
  overlay.className = 'stamp-overlay';
  overlay.innerHTML = `
    <div class="stamp-visual">
      <div class="l1">PLANO GERADO</div>
      <div class="l2">${todayISOForDisplay()}</div>
      <div class="l3">PROTOCOLO ${protocol}</div>
    </div>`;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
  setTimeout(() => { if(overlay.parentNode) overlay.remove(); }, 2200);
}
function todayISOForDisplay(){ return fmtDate(todayISO()); }

function switchTab(tab){ activeTab = tab; confirmingReset = false; render(); }

function requestReset(){ confirmingReset = true; render(); }
function cancelReset(){ confirmingReset = false; render(); }
function confirmReset(){
  state = { plan: null, sessions: [] };
  confirmingReset = false;
  stopTimer(true);
  saveState();
  activeTab = 'painel';
  render();
}

function toggleDisciplineCollapse(discId){
  collapsedDisciplines[discId] = !collapsedDisciplines[discId];
  render();
}

function findDiscipline(discId){ return state.plan.disciplines.find(d => d.id === discId); }
function findTopic(discId, topicId){ return findDiscipline(discId).topics.find(t => t.id === topicId); }

function toggleTopic(discId, topicId){
  const topic = findTopic(discId, topicId);
  topic.studied = !topic.studied;
  if(topic.studied){
    topic.studiedDate = todayISO();
    topic.reviews = [1,3,7,15,30].map(days => ({ date: addDays(todayISO(), days), done:false }));
  } else {
    topic.studiedDate = null;
    topic.reviews = [];
  }
  saveState();
  render();
}

function deleteTopic(discId, topicId){
  const d = findDiscipline(discId);
  d.topics = d.topics.filter(t => t.id !== topicId);
  saveState();
  render();
}

function addTopic(discId){
  const input = document.getElementById('newtopic-' + discId);
  const val = input.value.trim();
  if(!val) return;
  findDiscipline(discId).topics.push({ id: uid(), name: cap(val), studied:false, studiedDate:null, reviews:[] });
  input.value = '';
  saveState();
  render();
}

function deleteDiscipline(discId){
  state.plan.disciplines = state.plan.disciplines.filter(d => d.id !== discId);
  saveState();
  render();
}

function addDiscipline(){
  const input = document.getElementById('newdisc-name');
  const val = input.value.trim();
  if(!val) return;
  state.plan.disciplines.push({ id: uid(), name: cap(val), topics: [] });
  input.value = '';
  saveState();
  render();
}

function completeReview(discId, topicId, reviewDate){
  const topic = findTopic(discId, topicId);
  const rev = topic.reviews.find(r => r.date === reviewDate && !r.done);
  if(rev) rev.done = true;
  saveState();
  render();
}

/* ---- Timer ---- */
function startTimer(){
  const sel = document.getElementById('timer-discipline');
  if(!sel || !sel.value){ return; }
  timer.disciplineId = sel.value;
  timer.running = true;
  timer.intervalId = setInterval(() => {
    timer.seconds += 1;
    updateTimerDisplay();
  }, 1000);
  render();
}
function pauseTimer(){
  timer.running = false;
  if(timer.intervalId) clearInterval(timer.intervalId);
  render();
}
function stopTimer(discard){
  if(timer.intervalId) clearInterval(timer.intervalId);
  const minutes = Math.round(timer.seconds / 60);
  if(!discard && minutes > 0 && timer.disciplineId){
    state.sessions.push({ id: uid(), disciplineId: timer.disciplineId, minutes, date: todayISO() });
    saveState();
  }
  timer.running = false; timer.seconds = 0; timer.disciplineId = null;
  render();
}
function updateTimerDisplay(){
  const el = document.getElementById('timer-clock');
  if(!el) return;
  const h = String(Math.floor(timer.seconds/3600)).padStart(2,'0');
  const m = String(Math.floor((timer.seconds%3600)/60)).padStart(2,'0');
  const s = String(timer.seconds%60).padStart(2,'0');
  el.textContent = `${h}:${m}:${s}`;
}

/* ============ Derived stats ============ */
function allTopics(){
  if(!state.plan) return [];
  return state.plan.disciplines.flatMap(d => d.topics.map(t => ({...t, discId:d.id, discName:d.name})));
}
function disciplineStats(disc){
  const total = disc.topics.length;
  const studied = disc.topics.filter(t=>t.studied).length;
  const minutes = state.sessions.filter(s=>s.disciplineId===disc.id).reduce((a,s)=>a+s.minutes,0);
  return { total, studied, pct: total ? Math.round(studied/total*100) : 0, minutes };
}
function pendingReviews(){
  const today = todayISO();
  const out = [];
  state.plan.disciplines.forEach(d => {
    d.topics.forEach(t => {
      (t.reviews||[]).forEach(r => {
        if(!r.done && r.date <= today){
          out.push({ discId:d.id, discName:d.name, topicId:t.id, topicName:t.name, date:r.date, late: r.date < today });
        }
      });
    });
  });
  return out.sort((a,b) => a.date.localeCompare(b.date));
}

/* ============ Render: shell ============ */
function render(){
  const app = document.getElementById('app');
  if(!state.plan){
    app.innerHTML = renderHeader(false) + renderOnboarding();
    return;
  }
  app.innerHTML = renderHeader(true) + renderTabs() + renderActiveTab() + renderFooter();
  if(timer.running) updateTimerDisplay();
}

function renderHeader(showReset){
  return `
  <div class="topbar">
    <div class="logo-stamp">OE</div>
    <div class="title-block">
      <h1>Organizador de Edital</h1>
      <p>Plano de estudos · revisões · progresso</p>
    </div>
    ${showReset ? `<div class="topbar-actions"><button class="btn-ghost-small" onclick="requestReset()">Novo edital</button></div>` : ''}
  </div>`;
}

function renderFooter(){
  return `<footer class="credit">Seus dados ficam salvos apenas na sua conta, neste app.</footer>`;
}

function renderTabs(){
  const tabs = [
    ['painel','Painel'], ['plano','Plano'], ['cronometro','Cronômetro'],
    ['revisoes','Revisões'], ['relatorios','Relatórios']
  ];
  return `<div class="tabs">${tabs.map(([id,label]) =>
    `<button class="tab ${activeTab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`
  ).join('')}</div>
  ${confirmingReset ? `
  <div class="confirm-box">
    <span>Isso apaga o plano atual, checklist e histórico. Tem certeza?</span>
    <button class="btn" onclick="confirmReset()">Sim, apagar</button>
    <button class="btn secondary" onclick="cancelReset()">Cancelar</button>
  </div>` : ''}`;
}

function renderActiveTab(){
  if(activeTab==='plano') return renderPlano();
  if(activeTab==='cronometro') return renderCronometro();
  if(activeTab==='revisoes') return renderRevisoes();
  if(activeTab==='relatorios') return renderRelatorios();
  return renderPainel();
}

/* ============ Onboarding ============ */
function renderOnboarding(){
  return `
  <div class="onboarding">
    <h2>Cole o edital, receba um plano de estudos</h2>
    <p class="lede">Cole abaixo o conteúdo programático do edital (disciplinas e tópicos). O sistema organiza tudo em um checklist por disciplina, com cronômetro de horas, revisões automáticas e relatório de progresso.</p>
    <div class="card">
      <label style="font-size:12.5px;color:var(--ink-2);display:block;margin-bottom:6px;">Nome do concurso (opcional)</label>
      <input type="text" id="edital-title" placeholder="Ex: Concurso Tribunal Regional — Analista Judiciário" style="margin-bottom:14px;" />
      <label style="font-size:12.5px;color:var(--ink-2);display:block;margin-bottom:6px;">Conteúdo programático do edital</label>
      <textarea id="edital-input" rows="10" placeholder="LÍNGUA PORTUGUESA
1. Compreensão e interpretação de textos
2. Ortografia oficial
3. Pontuação

DIREITO CONSTITUCIONAL
1. Direitos e garantias fundamentais
2. Organização do Estado"></textarea>
      <div id="onboarding-error" style="display:none;color:var(--stamp);font-size:13px;margin-top:10px;"></div>
      <div style="margin-top:16px;">
        <button class="btn" onclick="generatePlan()">Gerar plano de estudos</button>
      </div>
      <p class="hint">Dica: mantenha os nomes das disciplinas em uma linha própria (de preferência em maiúsculas) e os tópicos em linhas ou itens separados — a organização automática funciona melhor assim. Você pode ajustar tudo manualmente depois.</p>
    </div>
  </div>`;
}

/* ============ Painel ============ */
function renderPainel(){
  const p = state.plan;
  const topics = allTopics();
  const studied = topics.filter(t=>t.studied).length;
  const pct = topics.length ? Math.round(studied/topics.length*100) : 0;
  const totalMinutes = state.sessions.reduce((a,s)=>a+s.minutes,0);
  const reviews = pendingReviews();
  const todayReviews = reviews.filter(r=>!r.late).slice(0,5);

  return `
  <div class="card" style="border-left:4px solid var(--stamp);">
    <p class="sub" style="margin-bottom:2px;">${escapeHtml(p.editalTitle)}</p>
    <h2 style="margin-bottom:12px;">Painel · Protocolo ${p.protocol}</h2>
    <div class="grid-stats">
      <div class="stat"><div class="num">${pct}%</div><div class="lbl">Conteúdo concluído</div></div>
      <div class="stat"><div class="num">${studied}/${topics.length}</div><div class="lbl">Tópicos estudados</div></div>
      <div class="stat"><div class="num">${(totalMinutes/60).toFixed(1)}h</div><div class="lbl">Horas estudadas</div></div>
      <div class="stat"><div class="num">${reviews.length}</div><div class="lbl">Revisões pendentes</div></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" onclick="switchTab('cronometro')">Iniciar estudo</button>
      <button class="btn outline" onclick="switchTab('plano')">Ver plano</button>
    </div>
  </div>

  <div class="card">
    <h2>Revisões de hoje</h2>
    ${todayReviews.length ? todayReviews.map(r => `
      <div class="review-row">
        <div class="rinfo">
          <div class="rdisc">${escapeHtml(r.discName)}</div>
          <div class="rtopic">${escapeHtml(r.topicName)}</div>
        </div>
        <button class="btn outline" onclick="completeReview('${r.discId}','${r.topicId}','${r.date}')">Concluir</button>
      </div>`).join('') : `<p class="empty-note">Nenhuma revisão para hoje. Marque tópicos como estudados no Plano para gerar revisões automáticas.</p>`}
  </div>`;
}

/* ============ Plano ============ */
function renderPlano(){
  const p = state.plan;
  return `
  <div class="card">
    <h2>Plano de estudos</h2>
    <p class="sub">Marque os tópicos conforme for estudando. Ao concluir um tópico, revisões são agendadas automaticamente (1, 3, 7, 15 e 30 dias).</p>
  </div>
  ${p.disciplines.map(d => renderDisciplineBlock(d)).join('')}
  <div class="card">
    <h2 style="font-size:15px;">Adicionar disciplina</h2>
    <div class="new-disc-row">
      <input type="text" id="newdisc-name" placeholder="Nome da disciplina" />
      <button class="btn secondary" onclick="addDiscipline()">Adicionar</button>
    </div>
  </div>`;
}

function renderDisciplineBlock(d){
  const stats = disciplineStats(d);
  const collapsed = collapsedDisciplines[d.id];
  return `
  <div class="discipline ${collapsed?'collapsed':''}">
    <div class="discipline-head" onclick="toggleDisciplineCollapse('${d.id}')">
      <span class="chevron">▾</span>
      <h3>${escapeHtml(d.name)}</h3>
      <span class="progress-pill">${stats.studied}/${stats.total} · ${stats.pct}%</span>
      <button class="disc-del" onclick="event.stopPropagation(); deleteDiscipline('${d.id}')" title="Remover disciplina">✕</button>
    </div>
    <div class="discipline-body">
      ${d.topics.map(t => `
        <div class="topic-row ${t.studied?'studied':''}">
          <input type="checkbox" ${t.studied?'checked':''} onchange="toggleTopic('${d.id}','${t.id}')" />
          <span class="tname">${escapeHtml(t.name)}</span>
          <button class="topic-del" onclick="deleteTopic('${d.id}','${t.id}')" title="Remover tópico">✕</button>
        </div>`).join('') || `<p class="empty-note">Nenhum tópico ainda.</p>`}
      <div class="add-row">
        <input type="text" id="newtopic-${d.id}" placeholder="Novo tópico" />
        <button class="btn outline" onclick="addTopic('${d.id}')">Adicionar</button>
      </div>
    </div>
  </div>`;
}

/* ============ Cronômetro ============ */
function renderCronometro(){
  const p = state.plan;
  const recent = [...state.sessions].reverse().slice(0,6);
  return `
  <div class="card">
    <h2>Cronômetro de estudo</h2>
    <p class="sub">Escolha a disciplina e cronometre sua sessão de estudo. O tempo é somado ao seu relatório de horas.</p>
    <select id="timer-discipline" ${timer.running?'disabled':''}>
      ${p.disciplines.map(d => `<option value="${d.id}" ${timer.disciplineId===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
    </select>
    <div class="timer-display" id="timer-clock">00:00:00</div>
    <div class="timer-controls">
      ${!timer.running
        ? `<button class="btn" onclick="startTimer()">${timer.seconds>0?'Retomar':'Iniciar'}</button>`
        : `<button class="btn secondary" onclick="pauseTimer()">Pausar</button>`}
      <button class="btn outline" onclick="stopTimer(false)" ${timer.seconds===0?'disabled':''}>Salvar e encerrar</button>
    </div>
  </div>
  <div class="card">
    <h2 style="font-size:15px;">Sessões recentes</h2>
    <div class="session-log">
      ${recent.length ? recent.map(s => {
        const d = findDiscipline(s.disciplineId);
        return `<div class="row"><span>${escapeHtml(d?d.name:'—')} · ${fmtDate(s.date)}</span><span>${s.minutes} min</span></div>`;
      }).join('') : `<p class="empty-note">Nenhuma sessão registrada ainda.</p>`}
    </div>
  </div>`;
}

/* ============ Revisões ============ */
function renderRevisoes(){
  const reviews = pendingReviews();
  const late = reviews.filter(r=>r.late);
  const today = reviews.filter(r=>!r.late);
  function row(r){
    return `
    <div class="review-row ${r.late?'late':''}">
      <div class="rinfo">
        <div class="rdisc">${escapeHtml(r.discName)}</div>
        <div class="rtopic">${escapeHtml(r.topicName)}</div>
      </div>
      <div class="rdate">${fmtDate(r.date)}</div>
      <button class="btn outline" onclick="completeReview('${r.discId}','${r.topicId}','${r.date}')">Concluir</button>
    </div>`;
  }
  return `
  <div class="card">
    <h2>Revisões</h2>
    <p class="sub">Geradas automaticamente quando você marca um tópico como estudado, seguindo intervalos de 1, 3, 7, 15 e 30 dias.</p>
    <div class="review-group">
      <h3>Atrasadas (${late.length})</h3>
      ${late.length ? late.map(row).join('') : `<p class="empty-note">Nenhuma revisão atrasada.</p>`}
    </div>
    <div class="review-group">
      <h3>Para hoje (${today.length})</h3>
      ${today.length ? today.map(row).join('') : `<p class="empty-note">Nenhuma revisão para hoje.</p>`}
    </div>
  </div>`;
}

/* ============ Relatórios ============ */
function renderRelatorios(){
  const p = state.plan;
  const stats = p.disciplines.map(d => ({ d, s: disciplineStats(d) }));
  const withOverdue = p.disciplines.map(d => {
    const overdue = d.topics.reduce((a,t) => a + (t.reviews||[]).filter(r=>!r.done && r.date < todayISO()).length, 0);
    return { name: d.name, overdue, pct: disciplineStats(d).pct, total: d.topics.length };
  }).filter(x => x.total > 0);
  const weak = [...withOverdue].sort((a,b) => (a.pct - b.pct) || (b.overdue - a.overdue)).slice(0,3)
    .filter(x => x.pct < 100);

  return `
  <div class="card">
    <h2>Progresso por disciplina</h2>
    ${stats.map(({d,s}) => `
      <div class="bar-row">
        <div class="blabel"><span>${escapeHtml(d.name)}</span><b>${s.pct}% · ${(s.minutes/60).toFixed(1)}h</b></div>
        <div class="btrack"><div class="bfill" style="width:${s.pct}%;"></div></div>
      </div>`).join('') || `<p class="empty-note">Adicione disciplinas no Plano para ver o progresso.</p>`}
  </div>
  <div class="card">
    <h2>Diagnóstico · pontos fracos</h2>
    <p class="sub">Disciplinas com menor conclusão ou mais revisões atrasadas.</p>
    ${weak.length ? weak.map(w => `
      <div class="weak-item">
        <span class="weak-flag">ATENÇÃO</span>
        <span>${escapeHtml(w.name)} — ${w.pct}% concluído${w.overdue?`, ${w.overdue} revisão(ões) atrasada(s)`:''}</span>
      </div>`).join('') : `<p class="empty-note">Nenhum ponto fraco identificado até agora — bom trabalho.</p>`}
  </div>`;
}

/* ============ Init ============ */
loadState();
</script>
