<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Serafas Aprende</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:#0A0F1C;
  --bg-dot:#111a2e;
  --panel:#111827;
  --panel-2:#151F32;
  --line:#232E45;
  --line-soft:#1A2338;
  --text:#E7ECF5;
  --text-2:#8B96AE;
  --text-3:#5B6785;
  --blue:#4C8DFF;
  --blue-dim:#1E3A66;
  --violet:#8B6EF2;
  --cyan:#37D6C4;
  --green:#34D399;
  --amber:#F5A623;
  --red:#F0575A;
  --radius:14px;
  --radius-sm:9px;
  --font-display:'Space Grotesk', 'Inter', sans-serif;
  --font-body:'Inter', -apple-system, sans-serif;
  --font-mono:'JetBrains Mono', 'Courier New', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, var(--bg-dot) 1px, transparent 1px) 0 0/22px 22px,
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
::selection{background:var(--blue-dim); color:#fff;}

.shell{display:flex; min-height:100vh;}
.sidebar{
  width:220px; flex:0 0 auto; border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 14px; gap:4px;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg, var(--blue), var(--violet));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:14px; color:#fff; flex:0 0 auto;
}
.brand-text b{display:block; font-family:var(--font-display); font-size:14.5px; font-weight:700; line-height:1.2;}
.brand-text span{display:block; font-size:10.5px; color:var(--text-3); font-family:var(--font-mono); letter-spacing:.4px; text-transform:uppercase;}

.navitem{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--text-2); font-size:13.5px; font-weight:500; cursor:pointer; border:none; background:none;
  text-align:left; width:100%;
}
.navitem svg{flex:0 0 auto; opacity:.8;}
.navitem:hover{background:var(--panel-2); color:var(--text);}
.navitem.active{background:var(--blue-dim); color:#fff;}
.navitem.active svg{opacity:1;}
.sidebar-footer{margin-top:auto; padding-top:10px; border-top:1px solid var(--line);}
.reset-link{
  display:flex; align-items:center; gap:8px; padding:9px 12px; font-size:12px; color:var(--text-3);
  background:none; border:none; cursor:pointer; width:100%; border-radius:var(--radius-sm); font-family:var(--font-mono);
}
.reset-link:hover{color:var(--red); background:rgba(240,87,90,.08);}

.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:18px 28px;
  border-bottom:1px solid var(--line);
}
.topbar .ttitle{font-family:var(--font-display); font-weight:700; font-size:18px;}
.topbar .tsub{font-size:12px; color:var(--text-3); font-family:var(--font-mono); margin-top:2px;}
.protocol-chip{
  margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-2);
  border:1px solid var(--line); padding:5px 11px; border-radius:999px; background:var(--panel-2);
}
main.content{padding:24px 28px 70px; max-width:1080px;}

.onboard-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.onboard-card{
  max-width:600px; width:100%; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:34px;
}
.onboard-card .brand{padding-bottom:18px;}
.onboard-card h2{font-family:var(--font-display); font-size:24px; margin:6px 0 8px;}
.onboard-card .lede{color:var(--text-2); font-size:14px; line-height:1.55; margin-bottom:22px;}
label.field-label{font-size:12px; color:var(--text-2); display:block; margin-bottom:6px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.4px;}
input[type=text], textarea, select{
  font-family:var(--font-body); font-size:14px; color:var(--text);
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px;
  background:var(--panel-2); width:100%;
}
input[type=text]::placeholder, textarea::placeholder{color:var(--text-3);}
textarea{resize:vertical; font-family:var(--font-mono); font-size:12.5px; line-height:1.55;}
.hint{font-size:11.5px; color:var(--text-3); margin-top:10px; line-height:1.5;}

.btn{
  background:var(--blue); color:#fff; border:none; border-radius:var(--radius-sm);
  padding:11px 20px; font-size:13.5px; font-weight:600; cursor:pointer;
}
.btn:hover{background:#3f79e6;}
.btn.secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
.btn.secondary:hover{border-color:var(--text-3);}
.btn.outline{background:transparent; color:var(--blue); border:1.5px solid var(--blue-dim);}
.btn.outline:hover{background:var(--blue-dim);}
.btn.danger{background:var(--red);}
.btn.danger:hover{background:#d94b4e;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.boot-overlay{
  position:fixed; inset:0; background:rgba(6,10,20,.9); z-index:50;
  display:flex; align-items:center; justify-content:center;
}
.boot-box{width:320px; text-align:left;}
.boot-box .blabel{font-family:var(--font-mono); font-size:12px; color:var(--cyan); margin-bottom:12px; min-height:16px;}
.boot-track{height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
.boot-fill{height:100%; width:0%; background:linear-gradient(90deg, var(--blue), var(--cyan)); transition:width 1.5s ease;}
.boot-pct{font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-top:8px; text-align:right;}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 22px; margin-bottom:16px;
}
.card h2{font-family:var(--font-display); font-size:16.5px; margin:0 0 4px; font-weight:600;}
.card .sub{color:var(--text-2); font-size:12.5px; margin:0 0 16px;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:16px;}
.stat-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; display:flex; align-items:center; gap:14px;
}
.stat-card .num{font-family:var(--font-mono); font-size:24px; font-weight:700; color:var(--text);}
.stat-card .lbl{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}
.ring-wrap{position:relative; width:56px; height:56px; flex:0 0 auto;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-wrap .rtext{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:700;}

.dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media (max-width:900px){ .dash-grid{grid-template-columns:1fr;} }

.heatmap{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px; overflow-x:auto; padding-bottom:6px;}
.hm-cell{width:12px;height:12px;border-radius:3px; background:var(--panel-2); border:1px solid var(--line-soft);}
.hm-1{background:#123a3a;}
.hm-2{background:#0f5f56;}
.hm-3{background:#149179;}
.hm-4{background:var(--green);}
.heatmap-legend{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-3); margin-top:8px; font-family:var(--font-mono);}
.heatmap-legend .hm-cell{width:10px;height:10px;}

.weekbars{display:flex; align-items:flex-end; gap:8px; height:90px; margin-top:6px;}
.weekbars .wb{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; justify-content:flex-end; height:100%;}
.weekbars .wb .fill{width:100%; background:linear-gradient(180deg, var(--blue), var(--violet)); border-radius:4px 4px 0 0; min-height:2px;}
.weekbars .wb .wlbl{font-size:9.5px; color:var(--text-3); font-family:var(--font-mono);}

.discipline{
  border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; background:var(--panel);
}
.discipline-head{
  display:flex; align-items:center; gap:10px; padding:14px 18px;
  border-bottom:1px solid var(--line); cursor:pointer; background:var(--panel-2);
}
.discipline-head h3{font-family:var(--font-display); font-size:14.5px; margin:0; flex:1; font-weight:600;}
.progress-pill{
  font-family:var(--font-mono); font-size:11px; color:var(--text-2);
  border:1px solid var(--line); padding:3px 10px; border-radius:999px; background:var(--panel);
}
.chevron{transition:transform .15s ease; color:var(--text-3); font-size:12px;}
.discipline.collapsed .chevron{transform:rotate(-90deg);}
.discipline.collapsed .discipline-body{display:none;}
.discipline-body{padding:8px 18px 16px;}
.mini-track{height:5px; background:var(--panel-2); border-radius:999px; overflow:hidden; margin:0 18px 0;}
.mini-fill{height:100%; background:linear-gradient(90deg,var(--blue),var(--cyan));}
.topic-row{
  display:flex; align-items:flex-start; gap:10px; padding:9px 0;
  border-bottom:1px solid var(--line-soft);
}
.topic-row:last-of-type{border-bottom:none;}
.topic-row input[type=checkbox]{margin-top:3px; width:17px; height:17px; accent-color:var(--green); flex:0 0 auto;}
.topic-row .tname{flex:1; font-size:13.5px; line-height:1.4;}
.topic-row.studied .tname{color:var(--text-3); text-decoration:line-through;}
.topic-del{background:none; border:none; color:var(--text-3); cursor:pointer; font-size:15px; line-height:1; padding:2px 4px;}
.topic-del:hover{color:var(--red);}
.add-row{display:flex; gap:8px; margin-top:10px;}
.disc-del{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;}
.disc-del:hover{color:var(--red);}
.new-disc-row{display:flex; gap:8px; margin-top:6px;}

.timer-shell{display:flex; flex-direction:column; align-items:center; padding:10px 0 4px;}
.timer-ring{position:relative; width:220px; height:220px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-clock-wrap{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.timer-clock-wrap .clock{font-family:var(--font-mono); font-size:34px; font-weight:700;}
.timer-clock-wrap .clabel{font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; text-align:center; max-width:170px;}
.chip-select{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:18px 0 6px;}
.chip{
  padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2);
  color:var(--text-2); font-size:12.5px; cursor:pointer;
}
.chip.active{background:var(--blue-dim); border-color:var(--blue); color:#fff;}
.timer-controls{display:flex; gap:10px; justify-content:center; margin-top:16px;}
.session-log{font-size:13px;}
.session-log .row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
.session-log .row span:last-child{font-family:var(--font-mono); color:var(--text-2);}

.review-group h3{
  font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--text-3); margin:18px 0 8px;
}
.review-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--line); margin-bottom:8px; background:var(--panel-2);
}
.review-row.late{border-color:rgba(240,87,90,.4); background:rgba(240,87,90,.06);}
.review-row .rinfo{flex:1;}
.review-row .rdisc{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-3); font-family:var(--font-mono);}
.review-row .rtopic{font-size:13.5px; margin-top:2px;}
.review-row .rdate{font-family:var(--font-mono); font-size:11.5px; color:var(--amber);}
.empty-note{color:var(--text-3); font-size:13px; padding:14px 0;}

.disc-ring-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px;}
.disc-ring-card{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;}
.disc-ring-card .dname{font-size:12px; color:var(--text-2); line-height:1.3;}
.weak-item{
  display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;
}
.weak-flag{color:var(--red); font-family:var(--font-mono); font-size:10.5px; border:1px solid rgba(240,87,90,.5); border-radius:5px; padding:2px 7px; flex:0 0 auto;}

.confirm-box{
  border:1px solid var(--red); background:rgba(240,87,90,.08); border-radius:var(--radius-sm);
  padding:12px 14px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}

footer.credit{text-align:center; color:var(--text-3); font-size:11px; margin-top:26px; font-family:var(--font-mono);}

@media (max-width:820px){
  .shell{flex-direction:column;}
  .sidebar{
    width:100%; height:auto; position:sticky; top:0; z-index:10;
    flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  .brand{padding:0 10px 0 0;}
  .brand-text span{display:none;}
  .navitem{flex-direction:column; gap:3px; padding:8px 12px; font-size:10.5px; white-space:nowrap;}
  .sidebar-footer{margin-top:0; border-top:none; margin-left:auto;}
  main.content{padding:18px 16px 60px;}
  .topbar{padding:14px 16px;}
  .timer-ring{width:170px; height:170px;}
  .timer-clock-wrap .clock{font-size:26px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
let state = { plan: null, sessions: [] };
let activeTab = 'painel';
let confirmingReset = false;
let collapsedDisciplines = {};

const timer = { running:false, seconds:0, disciplineId:null, intervalId:null };
const STORAGE_KEY = 'organizador-edital-v1';

const ICONS = {
  dashboard:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>',
  plano:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10M7 17h7"/></svg>',
  cronometro:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
  revisoes:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8M3 12a9 9 0 0 0 15.5 6.3L21 16"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>',
  relatorios:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  reset:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
};

function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function cap(s){ s = s.trim(); if(!s) return s; return s.charAt(0).toUpperCase() + s.slice(1); }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ }
  render();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Falha ao salvar', e); }
}

function isDisciplineHeader(line){
  if(line.length < 3 || line.length > 100) return false;
  const letters = line.replace(/[^A-Za-zÀ-ÿ]/g,'');
  if(letters.length < 4) return false;
  const upperLetters = letters.replace(/[^A-ZÀ-Ý]/g,'');
  const upperRatio = upperLetters.length / letters.length;
  const numberedCaps = /^\d+([.\-)]|\s)+[A-ZÀ-Ý]/.test(line) && upperRatio > 0.6;
  const allCapsLine = upperRatio > 0.85;
  return numberedCaps || allCapsLine;
}
function cleanHeader(line){
  return cap(line.replace(/^\d+([.\-)]\s*)+/, '').replace(/[:\-–]+$/, '').trim().toLowerCase());
}
function splitTopics(text){
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const topics = [];
  lines.forEach(line=>{
    let cleaned = line
      .replace(/^[\-•*]\s*/,'')
      .replace(/^\d+(\.\d+)*[.)]?\s*/,'')
      .replace(/^[a-zA-Z][.)]\s*/,'')
      .trim();
    if(!cleaned) return;
    if(cleaned.includes(';')){
      cleaned.split(';').forEach(t=>{ t=t.trim().replace(/^[\-•]\s*/,''); if(t) topics.push(cap(t)); });
    } else if(cleaned.length > 220 && /\d+\s+[A-ZÀ-Ý]/.test(cleaned)){
      cleaned.split(/\d+\s+(?=[A-ZÀ-Ý])/).map(s=>s.trim()).filter(Boolean).forEach(p=>topics.push(cap(p)));
    } else {
      topics.push(cap(cleaned));
    }
  });
  return topics.filter(t => t.length > 1);
}
function parseEdital(raw){
  const lines = raw.split('\n').map(l=>l.trim());
  const disciplines = [];
  let current = null;
  let buffer = [];
  function flush(){
    if(current){
      const topics = splitTopics(buffer.join('\n'));
      current.topics = topics.map(t => ({ id: uid(), name: t, studied:false, studiedDate:null, reviews:[] }));
      if(current.topics.length) disciplines.push(current);
    }
    buffer = [];
  }
  lines.forEach(line=>{
    if(!line) return;
    if(isDisciplineHeader(line)){
      flush();
      current = { id: uid(), name: cleanHeader(line), topics: [] };
    } else {
      if(!current) current = { id: uid(), name: 'Conteúdo geral', topics: [] };
      buffer.push(line);
    }
  });
  flush();
  return disciplines;
}

function generatePlan(){
  const raw = document.getElementById('edital-input').value;
  const titleInput = document.getElementById('edital-title');
  const title = titleInput ? titleInput.value.trim() : '';
  if(!raw || raw.trim().length < 10){
    alertInline('Cole o texto do edital (disciplinas e conteúdo programático) antes de gerar o plano.');
    return;
  }
  const disciplines = parseEdital(raw);
  if(!disciplines.length){
    alertInline('Não consegui identificar disciplinas no texto colado. Tente colar o conteúdo programático completo (com nomes de disciplinas em destaque ou maiúsculas).');
    return;
  }
  const protocol = 'ED-' + Date.now().toString().slice(-8);
  state.plan = {
    protocol,
    editalTitle: title || 'Edital sem título',
    generatedAt: todayISO(),
    disciplines
  };
  state.sessions = state.sessions || [];
  saveState();
  activeTab = 'painel';
  runBootSequence();
}

function alertInline(msg){
  const box = document.getElementById('onboarding-error');
  if(box){ box.textContent = msg; box.style.display = 'block'; }
}

function runBootSequence(){
  const overlay = document.createElement('div');
  overlay.className = 'boot-overlay';
  overlay.innerHTML = '<div class="boot-box"><div class="blabel" id="boot-label">Processando edital...</div><div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div><div class="boot-pct" id="boot-pct">0%</div></div>';
  document.body.appendChild(overlay);
  const label = overlay.querySelector('#boot-label');
  const fill = overlay.querySelector('#boot-fill');
  const pct = overlay.querySelector('#boot-pct');
  const steps = ['Processando edital...','Organizando disciplinas...','Agendando revisões...','Plano pronto.'];
  let i = 0;
  requestAnimationFrame(() => { fill.style.width = '100%'; });
  const stepTimer = setInterval(() => {
    i++;
    if(i < steps.length){ label.textContent = steps[i]; }
    if(i >= steps.length){ clearInterval(stepTimer); }
  }, 420);
  let p = 0;
  const pctTimer = setInterval(() => {
    p = Math.min(100, p + Math.round(100/ (1600/60)));
    pct.textContent = p + '%';
    if(p >= 100) clearInterval(pctTimer);
  }, 60);
  setTimeout(() => { overlay.remove(); render(); }, 1900);
}

function switchTab(tab){ activeTab = tab; confirmingReset = false; render(); }
function requestReset(){ confirmingReset = true; render(); }
function cancelReset(){ confirmingReset = false; render(); }
function confirmReset(){
  state = { plan: null, sessions: [] };
  confirmingReset = false;
  stopTimer(true);
  saveState();
  activeTab = 'painel';
  render();
}

function toggleDisciplineCollapse(discId){
  collapsedDisciplines[discId] = !collapsedDisciplines[discId];
  render();
}

function findDiscipline(discId){ return state.plan.disciplines.find(d => d.id === discId); }
function findTopic(discId, topicId){ return findDiscipline(discId).topics.find(t => t.id === topicId); }

function toggleTopic(discId, topicId){
  const topic = findTopic(discId, topicId);
  topic.studied = !topic.studied;
  if(topic.studied){
    topic.studiedDate = todayISO();
    topic.reviews = [1,3,7,15,30].map(days => ({ date: addDays(todayISO(), days), done:false }));
  } else {
    topic.studiedDate = null;
    topic.reviews = [];
  }
  saveState();
  render();
}

function deleteTopic(discId, topicId){
  const d = findDiscipline(discId);
  d.topics = d.topics.filter(t => t.id !== topicId);
  saveState();
  render();
}

function addTopic(discId){
  const input = document.getElementById('newtopic-' + discId);
  const val = input.value.trim();
  if(!val) return;
  findDiscipline(discId).topics.push({ id: uid(), name: cap(val), studied:false, studiedDate:null, reviews:[] });
  input.value = '';
  saveState();
  render();
}

function deleteDiscipline(discId){
  state.plan.disciplines = state.plan.disciplines.filter(d => d.id !== discId);
  saveState();
  render();
}

function addDiscipline(){
  const input = document.getElementById('newdisc-name');
  const val = input.value.trim();
  if(!val) return;
  state.plan.disciplines.push({ id: uid(), name: cap(val), topics: [] });
  input.value = '';
  saveState();
  render();
}

function completeReview(discId, topicId, reviewDate){
  const topic = findTopic(discId, topicId);
  const rev = topic.reviews.find(r => r.date === reviewDate && !r.done);
  if(rev) rev.done = true;
  saveState();
  render();
}

function selectTimerDiscipline(discId){
  if(timer.running) return;
  timer.disciplineId = discId;
  render();
}
function startTimer(){
  if(!timer.disciplineId){
    const first = state.plan.disciplines[0];
    if(!first) return;
    timer.disciplineId = first.id;
  }
  timer.running = true;
  timer.intervalId = setInterval(() => {
    timer.seconds += 1;
    updateTimerDisplay();
  }, 1000);
  render();
}
function pauseTimer(){
  timer.running = false;
  if(timer.intervalId) clearInterval(timer.intervalId);
  render();
}
function stopTimer(discard){
  if(timer.intervalId) clearInterval(timer.intervalId);
  const minutes = Math.round(timer.seconds / 60);
  if(!discard && minutes > 0 && timer.disciplineId){
    state.sessions.push({ id: uid(), disciplineId: timer.disciplineId, minutes, date: todayISO() });
    saveState();
  }
  timer.running = false; timer.seconds = 0; timer.disciplineId = null;
  render();
}
function updateTimerDisplay(){
  const el = document.getElementById('timer-clock');
  if(!el) return;
  const h = String(Math.floor(timer.seconds/3600)).padStart(2,'0');
  const m = String(Math.floor((timer.seconds%3600)/60)).padStart(2,'0');
  const s = String(timer.seconds%60).padStart(2,'0');
  el.textContent = h + ':' + m + ':' + s;
}

function allTopics(){
  if(!state.plan) return [];
  return state.plan.disciplines.flatMap(d => d.topics.map(t => Object.assign({}, t, {discId:d.id, discName:d.name})));
}
function disciplineStats(disc){
  const total = disc.topics.length;
  const studied = disc.topics.filter(t=>t.studied).length;
  const minutes = state.sessions.filter(s=>s.disciplineId===disc.id).reduce((a,s)=>a+s.minutes,0);
  return { total, studied, pct: total ? Math.round(studied/total*100) : 0, minutes };
}
function pendingReviews(){
  const today = todayISO();
  const out = [];
  state.plan.disciplines.forEach(d => {
    d.topics.forEach(t => {
      (t.reviews||[]).forEach(r => {
        if(!r.done && r.date <= today){
          out.push({ discId:d.id, discName:d.name, topicId:t.id, topicName:t.name, date:r.date, late: r.date < today });
        }
      });
    });
  });
  return out.sort((a,b) => a.date.localeCompare(b.date));
}
function minutesByDay(){
  const map = {};
  state.sessions.forEach(s => { map[s.date] = (map[s.date]||0) + s.minutes; });
  return map;
}
function computeStreak(){
  const map = minutesByDay();
  let streak = 0;
  let cursor = todayISO();
  if(!map[cursor]){
    cursor = addDays(cursor, -1);
  }
  while(map[cursor]){
    streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function heatmapCells(weeks){
  const map = minutesByDay();
  const cells = [];
  const start = addDays(todayISO(), -(weeks*7-1));
  for(let i=0;i<weeks*7;i++){
    const date = addDays(start, i);
    const mins = map[date] || 0;
    let level = 0;
    if(mins > 0) level = 1;
    if(mins >= 30) level = 2;
    if(mins >= 60) level = 3;
    if(mins >= 120) level = 4;
    cells.push({date, mins, level});
  }
  return cells;
}
function weeklySeries(){
  const map = minutesByDay();
  const out = [];
  for(let i=6;i>=0;i--){
    const date = addDays(todayISO(), -i);
    out.push({ date, minutes: map[date] || 0 });
  }
  return out;
}

function ringSVG(pct, size, color, strokeW){
  strokeW = strokeW || 5;
  const r = (size - strokeW) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.min(100,pct) / 100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">' +
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+strokeW+'"/>' +
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+strokeW+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" stroke-linecap="round"/>' +
    '</svg>';
}

function render(){
  const app = document.getElementById('app');
  if(!state.plan){
    app.innerHTML = renderOnboarding();
    return;
  }
  app.innerHTML =
    '<div class="shell">' +
      renderSidebar() +
      '<div class="main-col">' +
        renderTopbar() +
        '<main class="content">' +
          (confirmingReset ? renderConfirmBox() : '') +
          renderActiveTab() +
          renderFooter() +
        '</main>' +
      '</div>' +
    '</div>';
  if(timer.running) updateTimerDisplay();
}

function renderSidebar(){
  const items = [
    ['painel','Painel','dashboard'], ['plano','Plano','plano'], ['cronometro','Cronômetro','cronometro'],
    ['revisoes','Revisões','revisoes'], ['relatorios','Relatórios','relatorios']
  ];
  return '<aside class="sidebar">' +
    '<div class="brand"><div class="brand-mark">SA</div><div class="brand-text"><b>Serafas</b><span>Aprende</span></div></div>' +
    items.map(function(it){
      return '<button class="navitem '+(activeTab===it[0]?'active':'')+'" onclick="switchTab(\''+it[0]+'\')">'+ICONS[it[2]]+'<span>'+it[1]+'</span></button>';
    }).join('') +
    '<div class="sidebar-footer"><button class="reset-link" onclick="requestReset()">'+ICONS.reset+'<span>Novo edital</span></button></div>' +
  '</aside>';
}

function renderTopbar(){
  const p = state.plan;
  const titles = { painel:'Painel', plano:'Plano de estudos', cronometro:'Cronômetro', revisoes:'Revisões', relatorios:'Relatórios' };
  return '<div class="topbar"><div><div class="ttitle">'+titles[activeTab]+'</div><div class="tsub">'+escapeHtml(p.editalTitle)+'</div></div>' +
    '<div class="protocol-chip">PROTOCOLO '+p.protocol+'</div></div>';
}

function renderConfirmBox(){
  return '<div class="confirm-box"><span>Isso apaga o plano atual, checklist e histórico. Tem certeza?</span>' +
    '<button class="btn danger" onclick="confirmReset()">Sim, apagar</button>' +
    '<button class="btn secondary" onclick="cancelReset()">Cancelar</button></div>';
}

function renderFooter(){
  return '<footer class="credit">Seus dados ficam salvos neste navegador, neste computador.</footer>';
}

function renderActiveTab(){
  if(activeTab==='plano') return renderPlano();
  if(activeTab==='cronometro') return renderCronometro();
  if(activeTab==='revisoes') return renderRevisoes();
  if(activeTab==='relatorios') return renderRelatorios();
  return renderPainel();
}

function renderOnboarding(){
  return '<div class="onboard-wrap"><div class="onboard-card">' +
    '<div class="brand"><div class="brand-mark">SA</div><div class="brand-text"><b>Serafas</b><span>Aprende</span></div></div>' +
    '<h2>Cole o edital, receba um plano de estudos</h2>' +
    '<p class="lede">Cole o conteúdo programático do edital abaixo. O sistema organiza tudo em um dashboard com checklist por disciplina, cronômetro de horas, revisões automáticas e relatório de progresso.</p>' +
    '<label class="field-label">Nome do concurso (opcional)</label>' +
    '<input type="text" id="edital-title" placeholder="Ex: Concurso Tribunal Regional — Analista Judiciário" style="margin-bottom:14px;" />' +
    '<label class="field-label">Conteúdo programático do edital</label>' +
    '<textarea id="edital-input" rows="10" placeholder="LÍNGUA PORTUGUESA&#10;1. Compreensão e interpretação de textos&#10;2. Ortografia oficial&#10;3. Pontuação&#10;&#10;DIREITO CONSTITUCIONAL&#10;1. Direitos e garantias fundamentais&#10;2. Organização do Estado"></textarea>' +
    '<div id="onboarding-error" style="display:none;color:var(--red);font-size:13px;margin-top:10px;"></div>' +
    '<div style="margin-top:18px;"><button class="btn" onclick="generatePlan()">Gerar plano de estudos</button></div>' +
    '<p class="hint">Dica: mantenha os nomes das disciplinas em uma linha própria (de preferência em maiúsculas) e os tópicos em linhas ou itens separados. Você pode ajustar tudo manualmente depois, no dashboard.</p>' +
    '</div></div>';
}

function renderPainel(){
  const p = state.plan;
  const topics = allTopics();
  const studied = topics.filter(t=>t.studied).length;
  const pct = topics.length ? Math.round(studied/topics.length*100) : 0;
  const totalMinutes = state.sessions.reduce((a,s)=>a+s.minutes,0);
  const reviews = pendingReviews();
  const todayReviews = reviews.filter(r=>!r.late).slice(0,5);
  const streak = computeStreak();
  const cells = heatmapCells(14);
  const week = weeklySeries();
  const maxWeekMin = Math.max(30, Math.max.apply(null, week.map(function(w){return w.minutes;})));
  const diasSemana = ['D','S','T','Q','Q','S','S'];

  let html = '<div class="stat-grid">';
  html += '<div class="stat-card"><div class="ring-wrap">'+ringSVG(pct,56,'var(--blue)')+'<div class="rtext">'+pct+'%</div></div><div><div class="num">'+studied+'/'+topics.length+'</div><div class="lbl">Tópicos concluídos</div></div></div>';
  html += '<div class="stat-card"><div class="ring-wrap">'+ringSVG(Math.min(100,(totalMinutes/60)*4),56,'var(--violet)')+'<div class="rtext">'+(totalMinutes/60).toFixed(1)+'h</div></div><div><div class="num">'+(totalMinutes/60).toFixed(1)+'h</div><div class="lbl">Horas estudadas</div></div></div>';
  html += '<div class="stat-card"><div class="ring-wrap">'+ringSVG(Math.min(100,streak*10),56,'var(--green)')+'<div class="rtext">'+streak+'</div></div><div><div class="num">'+streak+' '+(streak===1?'dia':'dias')+'</div><div class="lbl">Sequência de estudo</div></div></div>';
  html += '<div class="stat-card"><div class="ring-wrap">'+ringSVG(reviews.length?100:0,56,'var(--amber)')+'<div class="rtext">'+reviews.length+'</div></div><div><div class="num">'+reviews.length+'</div><div class="lbl">Revisões pendentes</div></div></div>';
  html += '</div>';

  html += '<div class="dash-grid">';
  html += '<div class="card"><h2>Constância</h2><p class="sub">Últimas 14 semanas de estudo</p><div class="heatmap">';
  html += cells.map(function(c){ return '<div class="hm-cell '+(c.level?'hm-'+c.level:'')+'" title="'+fmtDate(c.date)+' · '+c.mins+'min"></div>'; }).join('');
  html += '</div><div class="heatmap-legend">Menos<div class="hm-cell"></div><div class="hm-cell hm-1"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div>Mais</div></div>';
  html += '<div class="card"><h2>Últimos 7 dias</h2><p class="sub">Minutos estudados por dia</p><div class="weekbars">';
  html += week.map(function(w){
    return '<div class="wb"><div class="fill" style="height:'+Math.max(3,(w.minutes/maxWeekMin)*70)+'px;" title="'+w.minutes+' min"></div><div class="wlbl">'+diasSemana[new Date(w.date+'T00:00:00').getDay()]+'</div></div>';
  }).join('');
  html += '</div></div></div>';

  html += '<div class="card"><h2>Revisões de hoje</h2>';
  if(todayReviews.length){
    html += todayReviews.map(function(r){
      return '<div class="review-row"><div class="rinfo"><div class="rdisc">'+escapeHtml(r.discName)+'</div><div class="rtopic">'+escapeHtml(r.topicName)+'</div></div>' +
        '<button class="btn outline" onclick="completeReview(\''+r.discId+'\',\''+r.topicId+'\',\''+r.date+'\')">Concluir</button></div>';
    }).join('');
  } else {
    html += '<p class="empty-note">Nenhuma revisão para hoje. Marque tópicos como estudados no Plano para gerar revisões automáticas.</p>';
  }
  html += '</div>';
  return html;
}

function renderPlano(){
  const p = state.plan;
  let html = p.disciplines.map(renderDisciplineBlock).join('');
  html += '<div class="card"><h2 style="font-size:14.5px;">Adicionar disciplina</h2><div class="new-disc-row">' +
    '<input type="text" id="newdisc-name" placeholder="Nome da disciplina" />' +
    '<button class="btn secondary" onclick="addDiscipline()">Adicionar</button></div></div>';
  return html;
}

function renderDisciplineBlock(d){
  const stats = disciplineStats(d);
  const collapsed = collapsedDisciplines[d.id];
  let html = '<div class="discipline '+(collapsed?'collapsed':'')+'">';
  html += '<div class="discipline-head" onclick="toggleDisciplineCollapse(\''+d.id+'\')">' +
    '<span class="chevron">▾</span><h3>'+escapeHtml(d.name)+'</h3>' +
    '<span class="progress-pill">'+stats.studied+'/'+stats.total+' · '+stats.pct+'%</span>' +
    '<button class="disc-del" onclick="event.stopPropagation(); deleteDiscipline(\''+d.id+'\')" title="Remover disciplina">✕</button></div>';
  html += '<div class="mini-track" style="margin-top:10px;"><div class="mini-fill" style="width:'+stats.pct+'%;"></div></div>';
  html += '<div class="discipline-body">';
  html += d.topics.map(function(t){
    return '<div class="topic-row '+(t.studied?'studied':'')+'">' +
      '<input type="checkbox" '+(t.studied?'checked':'')+' onchange="toggleTopic(\''+d.id+'\',\''+t.id+'\')" />' +
      '<span class="tname">'+escapeHtml(t.name)+'</span>' +
      '<button class="topic-del" onclick="deleteTopic(\''+d.id+'\',\''+t.id+'\')" title="Remover tópico">✕</button></div>';
  }).join('') || '<p class="empty-note">Nenhum tópico ainda.</p>';
  html += '<div class="add-row"><input type="text" id="newtopic-'+d.id+'" placeholder="Novo tópico" />' +
    '<button class="btn outline" onclick="addTopic(\''+d.id+'\')">Adicionar</button></div>';
  html += '</div></div>';
  return html;
}

function renderCronometro(){
  const p = state.plan;
  const recent = state.sessions.slice().reverse().slice(0,6);
  const activeId = timer.disciplineId || (p.disciplines[0] && p.disciplines[0].id);
  const activeDisc = p.disciplines.find(function(d){return d.id===activeId;});
  let html = '<div class="card"><h2>Cronômetro de estudo</h2><p class="sub">Escolha a disciplina e cronometre sua sessão. O tempo é somado ao seu relatório de horas.</p>';
  html += '<div class="chip-select">' + p.disciplines.map(function(d){
    return '<button class="chip '+(activeId===d.id?'active':'')+'" '+(timer.running?'disabled':'')+' onclick="selectTimerDiscipline(\''+d.id+'\')">'+escapeHtml(d.name)+'</button>';
  }).join('') + '</div>';
  html += '<div class="timer-shell"><div class="timer-ring">' + ringSVG(timer.running?60:0,220,'var(--blue)',6) +
    '<div class="timer-clock-wrap"><div class="clock" id="timer-clock">00:00:00</div>' +
    '<div class="clabel">'+(activeDisc?escapeHtml(activeDisc.name):'Selecione uma disciplina')+'</div></div></div>';
  html += '<div class="timer-controls">';
  html += !timer.running
    ? '<button class="btn" onclick="startTimer()">'+(timer.seconds>0?'Retomar':'Iniciar')+'</button>'
    : '<button class="btn secondary" onclick="pauseTimer()">Pausar</button>';
  html += '<button class="btn outline" onclick="stopTimer(false)" '+(timer.seconds===0?'disabled':'')+'>Salvar e encerrar</button>';
  html += '</div></div></div>';
  html += '<div class="card"><h2 style="font-size:14.5px;">Sessões recentes</h2><div class="session-log">';
  html += recent.length ? recent.map(function(s){
    const d = findDiscipline(s.disciplineId);
    return '<div class="row"><span>'+(d?escapeHtml(d.name):'—')+' · '+fmtDate(s.date)+'</span><span>'+s.minutes+' min</span></div>';
  }).join('') : '<p class="empty-note">Nenhuma sessão registrada ainda.</p>';
  html += '</div></div>';
  return html;
}

function renderRevisoes(){
  const reviews = pendingReviews();
  const late = reviews.filter(function(r){return r.late;});
  const today = reviews.filter(function(r){return !r.late;});
  function row(r){
    return '<div class="review-row '+(r.late?'late':'')+'"><div class="rinfo"><div class="rdisc">'+escapeHtml(r.discName)+'</div><div class="rtopic">'+escapeHtml(r.topicName)+'</div></div>' +
      '<div class="rdate">'+fmtDate(r.date)+'</div>' +
      '<button class="btn outline" onclick="completeReview(\''+r.discId+'\',\''+r.topicId+'\',\''+r.date+'\')">Concluir</button></div>';
  }
  let html = '<div class="card"><h2>Revisões</h2><p class="sub">Geradas automaticamente quando você marca um tópico como estudado, seguindo intervalos de 1, 3, 7, 15 e 30 dias.</p>';
  html += '<div class="review-group"><h3>Atrasadas ('+late.length+')</h3>' + (late.length ? late.map(row).join('') : '<p class="empty-note">Nenhuma revisão atrasada.</p>') + '</div>';
  html += '<div class="review-group"><h3>Para hoje ('+today.length+')</h3>' + (today.length ? today.map(row).join('') : '<p class="empty-note">Nenhuma revisão para hoje.</p>') + '</div>';
  html += '</div>';
  return html;
}

function renderRelatorios(){
  const p = state.plan;
  const withOverdue = p.disciplines.map(function(d){
    const overdue = d.topics.reduce(function(a,t){ return a + (t.reviews||[]).filter(function(r){return !r.done && r.date < todayISO();}).length; }, 0);
    const s = disciplineStats(d);
    return { id:d.id, name: d.name, overdue: overdue, pct: s.pct, total: d.topics.length, minutes: s.minutes };
  }).filter(function(x){ return x.total > 0; });
  const weak = withOverdue.slice().sort(function(a,b){ return (a.pct - b.pct) || (b.overdue - a.overdue); }).slice(0,3)
    .filter(function(x){ return x.pct < 100; });
  const ringColors = ['var(--blue)','var(--violet)','var(--cyan)','var(--green)','var(--amber)'];

  let html = '<div class="card"><h2>Progresso por disciplina</h2><div class="disc-ring-grid">';
  html += withOverdue.length ? withOverdue.map(function(d,i){
    return '<div class="disc-ring-card"><div class="ring-wrap" style="width:76px;height:76px;">' +
      ringSVG(d.pct,76,ringColors[i%ringColors.length],7) + '<div class="rtext" style="font-size:14px;">'+d.pct+'%</div></div>' +
      '<div class="dname">'+escapeHtml(d.name)+'</div>' +
      '<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);">'+(d.minutes/60).toFixed(1)+'h</div></div>';
  }).join('') : '<p class="empty-note">Adicione disciplinas no Plano para ver o progresso.</p>';
  html += '</div></div>';

  html += '<div class="card"><h2>Diagnóstico · pontos fracos</h2><p class="sub">Disciplinas com menor conclusão ou mais revisões atrasadas.</p>';
  html += weak.length ? weak.map(function(w){
    return '<div class="weak-item"><span class="weak-flag">ATENÇÃO</span><span>'+escapeHtml(w.name)+' — '+w.pct+'% concluído'+(w.overdue?(', '+w.overdue+' revisão(ões) atrasada(s)'):'')+'</span></div>';
  }).join('') : '<p class="empty-note">Nenhum ponto fraco identificado até agora — bom trabalho.</p>';
  html += '</div>';
  return html;
}

loadState();
</script>
</body>
</html>
